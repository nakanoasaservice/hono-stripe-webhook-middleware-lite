name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: "1.7.0"
          cache: true
          run-install: false

      - name: Verify declared Node.js runtime
        run: node -e 'const expected = require("./package.json").devEngines.runtime.version; if (process.versions.node !== expected) throw new Error(`Expected Node ${expected}, got ${process.version}`)'

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Check
        run: pnpm run check

      - name: Run Type Check
        run: pnpm run check-types

      - name: Run Tests
        run: pnpm run test

      - name: Run build
        run: pnpm run build

      - name: Check JSR package
        run: pnpm exec jsr publish --dry-run

      - name: Check npm package contents
        run: npm pack --dry-run

      - name: Check for uncommitted changes after build
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Uncommitted changes detected after build:"
            git status
            exit 1
          fi
